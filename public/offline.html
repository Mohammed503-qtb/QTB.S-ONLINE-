<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر الأصيل — لا يوجد اتصال</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #ffffff;
    color: #14532d;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 360px;
    width: 100%;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 24px;
    padding: 40px 24px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .icon {
    width: 88px; height: 88px;
    margin: 0 auto 20px;
    background: #0d9468;
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
  }
  h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #14532d; }
  p { font-size: 14px; line-height: 1.8; color: #166534; margin-bottom: 24px; }
  button {
    font-family: inherit;
    min-height: 48px;
    padding: 12px 28px;
    background: #0d9468;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .15s ease, opacity .15s ease;
  }
  button:active { transform: scale(0.96); }
  .hint { margin-top: 16px; font-size: 12px; color: #15803d; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل حاليًا.<br>تحقق من الشبكة ثم أعد المحاولة — التطبيق سيعود للعمل مباشرة.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <p class="hint">ستجد صفحاتك التي زرتها سابقًا متاحة هنا بلا إنترنت</p>
  </div>
  <script>
    // عند عودة الاتصال، عد للتطبيق تلقائيًا
    addEventListener('online', function () { location.replace('/') });
  </script>
</body>
</html>
