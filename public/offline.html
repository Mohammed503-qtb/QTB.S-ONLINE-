<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر الأصيل — لا يوجد اتصال</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
    background: #ffffff;
    color: #14532d;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 360px;
    width: 100%;
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 24px;
    padding: 40px 24px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .icon {
    width: 88px; height: 88px;
    margin: 0 auto 20px;
    background: #0d9468;
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  h1 { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #14532d; }
  p { font-size: 14px; line-height: 1.8; color: #166534; margin-bottom: 20px; }
  button {
    font-family: inherit;
    min-height: 48px;
    padding: 12px 28px;
    background: #0d9468;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .15s ease, opacity .15s ease;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.75; }
  .status {
    margin-top: 14px;
    font-size: 12px;
    line-height: 1.7;
    color: #15803d;
    min-height: 2.6em;
  }
  .dot { display: inline-block; margin-inline-start: 4px; }
  .dot::after { content: "٫"; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: "٫"; } 25% { content: "٫٫"; } 50% { content: "٫٫٫"; } 75% { content: " "; } }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل حاليًا.<br>لا تقلق — سيدخل المتجر تلقائيًا فور عودة الاتصال.</p>
    <button id="retry">إعادة المحاولة</button>
    <p class="status" id="status">جارِ التحقق من الاتصال<span class="dot"></span></p>
  </div>
  <script>
    // ============================================================
    // استعادة تلقائية نشطة: فحص حقيقي للاتصال (وليس مجرد حدث
    // "online" المتقلب) — محاولة فورية عند الإقلاع/الظهور/الحدث
    // + كل 3 ثوانٍ تلقائيًا. عند نجاح الفحص ندخل المتجر مباشرة.
    // ============================================================
    var navigating = false

    function setStatus(text, withDots) {
      var el = document.getElementById('status')
      el.innerHTML = text + (withDots ? '<span class="dot"></span>' : '')
    }

    function checkConnection() {
      if (navigating || document.visibilityState === 'hidden') return Promise.resolve(false)
      return fetch('/manifest.webmanifest', { method: 'HEAD', cache: 'no-store' })
        .then(function (res) {
          if (res.ok && !navigating) enterStore()
          return res.ok
        })
        .catch(function () { return false })
    }

    function enterStore() {
      navigating = true
      setStatus('عاد الاتصال — جارِ فتح المتجر', true)
      location.replace('/')
    }

    // فحص فوري عند الإقلاع
    checkConnection()

    // فحص دوري كل 3 ثوانٍ (يعمل حتى لو فات حدث online أو فشلت أول محاولة بعده)
    setInterval(checkConnection, 3000)

    // أحداث تسرّع الاستعادة
    addEventListener('online', function () { checkConnection() })
    addEventListener('pageshow', function () { checkConnection() })
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') checkConnection()
    })

    // زر إعادة المحاولة: تحقق فوري مع مؤشر حالة واضح
    document.getElementById('retry').addEventListener('click', function () {
      var btn = this
      btn.disabled = true
      btn.textContent = 'جارِ التحقق…'
      setStatus('جارِ التحقق من الاتصال', true)
      checkConnection().then(function (ok) {
        if (!ok) {
          btn.disabled = false
          btn.textContent = 'إعادة المحاولة'
          setStatus('ما زال لا يوجد اتصال — سنحاول تلقائيًا كل ٣ ثوانٍ', false)
        }
      })
    })
  </script>
</body>
</html>
